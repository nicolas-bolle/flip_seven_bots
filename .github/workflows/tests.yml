name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: unit-tests-and-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e . pytest pytest-cov
      - run: python -m pytest --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=100