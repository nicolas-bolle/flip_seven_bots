[project]
name = "flip-seven-bots"
version = "0.1.0"
description = "Bots for the game Flip 7"
readme = "README.md"
authors = [
    { name = "nicolas-bolle", email = "nicolasbolle@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pygame-ce>=2.5.8",
    "tqdm>=4.70.1",
]

[project.scripts]
flip7 = "flip_seven_bots.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
unfixable = ['F401']

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
